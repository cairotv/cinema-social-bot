name: Test YouTube Methods

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yt-dlp

      - name: Run YouTube Tester
        run: python youtube_tester.py

      - name: Upload Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-test-results
          path: |
            youtube_test_results.log
            youtube_test_results.json
